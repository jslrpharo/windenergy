<svg viewBox="0 0 500 660" xmlns="http://www.w3.org/2000/svg" role="img" style="background:#fff">
  <title>Cilindro hidráulico — Bloqueado (posición neutra)</title>
  <desc>Circuito hidráulico con válvula 4/3 en posición central: todos los puertos bloqueados, cilindro inmovilizado.</desc>
  <defs>
    <marker id="ah-black" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="7" markerHeight="5" orient="auto-start-reverse">
      <polygon points="0 0, 10 3.5, 0 7" fill="#444"/>
    </marker>
    <pattern id="fluid" patternUnits="userSpaceOnUse" width="20" height="6">
      <path d="M0 3 Q5 0 10 3 T20 3" stroke="#1a73e8" stroke-width="0.8" fill="none" opacity="0.5"/>
    </pattern>
    <linearGradient id="piston-g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#888"/>
      <stop offset="100%" stop-color="#666"/>
    </linearGradient>
    <linearGradient id="rod-g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#aaa"/>
      <stop offset="100%" stop-color="#888"/>
    </linearGradient>
  </defs>
  <style>
    .pipe{stroke:#555;stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round}
    .pipe-inactive{stroke:#aaa;stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:8,4}
    .lbl{font-family:Arial,Helvetica,sans-serif;font-size:13px;fill:#333}
    .lbl-sm{font-family:Arial,Helvetica,sans-serif;font-size:11px;fill:#666}
    .lbl-port{font-family:Arial,Helvetica,sans-serif;font-size:12px;font-weight:700;fill:#444}
    .lbl-title{font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:700;fill:#222}
    .lbl-sub{font-family:Arial,Helvetica,sans-serif;font-size:12px;fill:#666}
    .valve-box{stroke:#555;stroke-width:2;fill:#f7f7f7}
    .valve-active{fill:rgba(220,53,69,0.08);stroke:#dc3545;stroke-width:2.5}
    .valve-arrow{stroke:#444;stroke-width:1.8;fill:none}
  </style>

  <!-- Title -->
  <text x="250" y="28" text-anchor="middle" class="lbl-title">Cilindro hidráulico — Bloqueado</text>
  <text x="250" y="46" text-anchor="middle" class="lbl-sub">Válvula 4/3 posición central: todos los puertos cerrados</text>

  <!-- CYLINDER -->
  <rect x="130" y="72" width="240" height="85" rx="4" fill="#e0e0e0" stroke="#555" stroke-width="2.5"/>
  <!-- Left chamber (neutral) -->
  <rect x="132" y="74" width="112" height="81" rx="3" fill="rgba(180,180,180,0.15)"/>
  <rect x="132" y="74" width="112" height="81" rx="3" fill="url(#fluid)" opacity="0.5"/>
  <!-- Right chamber (neutral) -->
  <rect x="264" y="74" width="104" height="81" rx="3" fill="rgba(180,180,180,0.15)"/>
  <rect x="264" y="74" width="104" height="81" rx="3" fill="url(#fluid)" opacity="0.5"/>
  <!-- Piston -->
  <rect x="244" y="72" width="20" height="85" fill="url(#piston-g)" stroke="#444" stroke-width="2"/>
  <!-- Rod -->
  <rect x="264" y="103" width="115" height="22" rx="3" fill="url(#rod-g)" stroke="#444" stroke-width="1.8"/>
  <rect x="375" y="106" width="10" height="16" rx="2" fill="#999" stroke="#444" stroke-width="1.5"/>
  <!-- Lock symbol -->
  <g transform="translate(395,60)">
    <rect x="0" y="8" width="16" height="12" rx="2" fill="#dc3545" opacity="0.7" stroke="#a02030" stroke-width="1.2"/>
    <path d="M3,8 V5 a5,5 0 0 1 10,0 V8" fill="none" stroke="#a02030" stroke-width="1.5"/>
  </g>
  <text x="250" y="66" text-anchor="middle" class="lbl" font-weight="600">Cilindro de doble efecto</text>

  <!-- PORT A (inactive) -->
  <circle cx="195" cy="157" r="4" fill="#aaa" stroke="#fff" stroke-width="1.5"/>
  <text x="178" y="180" class="lbl-port" fill="#999">A</text>
  <polyline points="195,161 195,250 238,250 238,295" class="pipe-inactive"/>

  <!-- PORT B (inactive) -->
  <circle cx="310" cy="157" r="4" fill="#aaa" stroke="#fff" stroke-width="1.5"/>
  <text x="318" y="180" class="lbl-port" fill="#999">B</text>
  <polyline points="310,161 310,250 272,250 272,295" class="pipe-inactive"/>

  <!-- VALVE: Box 1 EXTEND (inactive) -->
  <rect x="150" y="295" width="70" height="70" rx="2" class="valve-box"/>
  <line x1="168" y1="357" x2="168" y2="305" class="valve-arrow" marker-end="url(#ah-black)"/>
  <line x1="202" y1="303" x2="202" y2="355" class="valve-arrow" marker-end="url(#ah-black)"/>

  <!-- VALVE: Box 2 NEUTRAL (ACTIVE — blocked) -->
  <rect x="220" y="295" width="70" height="70" rx="2" class="valve-active"/>
  <!-- T-blocks for all 4 ports (BLOCKED) -->
  <line x1="238" y1="303" x2="238" y2="318" stroke="#dc3545" stroke-width="2"/>
  <line x1="230" y1="318" x2="246" y2="318" stroke="#dc3545" stroke-width="2.5"/>
  <line x1="272" y1="303" x2="272" y2="318" stroke="#dc3545" stroke-width="2"/>
  <line x1="264" y1="318" x2="280" y2="318" stroke="#dc3545" stroke-width="2.5"/>
  <line x1="238" y1="357" x2="238" y2="342" stroke="#dc3545" stroke-width="2"/>
  <line x1="230" y1="342" x2="246" y2="342" stroke="#dc3545" stroke-width="2.5"/>
  <line x1="272" y1="357" x2="272" y2="342" stroke="#dc3545" stroke-width="2"/>
  <line x1="264" y1="342" x2="280" y2="342" stroke="#dc3545" stroke-width="2.5"/>
  <!-- Active indicator -->
  <rect x="220" y="368" width="70" height="4" rx="2" fill="#dc3545"/>

  <!-- VALVE: Box 3 RETRACT (inactive) -->
  <rect x="290" y="295" width="70" height="70" rx="2" class="valve-box"/>
  <line x1="308" y1="355" x2="342" y2="305" class="valve-arrow" marker-end="url(#ah-black)"/>
  <line x1="308" y1="305" x2="342" y2="355" class="valve-arrow" marker-end="url(#ah-black)"/>

  <!-- Spring LEFT -->
  <polyline points="150,315 140,318 148,324 140,330 148,336 140,342 150,345" fill="none" stroke="#777" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Spring RIGHT (center position = both springs hold) -->
  <polyline points="360,315 370,318 362,324 370,330 362,336 370,342 360,345" fill="none" stroke="#777" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Valve label + port labels -->
  <text x="255" y="392" text-anchor="middle" class="lbl" font-weight="600">Válvula direccional 4/3</text>
  <text x="238" y="290" text-anchor="middle" class="lbl-port">A</text>
  <text x="272" y="290" text-anchor="middle" class="lbl-port">B</text>
  <text x="225" y="385" text-anchor="end" class="lbl-port">P</text>
  <text x="285" y="385" text-anchor="start" class="lbl-port">T</text>

  <!-- PIPE P: valve → pump (inactive) -->
  <polyline points="238,365 238,430 155,430 155,475" class="pipe-inactive"/>
  <!-- PIPE T: valve → tank (inactive) -->
  <polyline points="272,365 272,430 350,430 350,480" class="pipe-inactive"/>

  <!-- PUMP -->
  <circle cx="155" cy="500" r="26" fill="#fff" stroke="#555" stroke-width="2.5"/>
  <polygon points="143,512 167,512 155,488" fill="none" stroke="#555" stroke-width="2"/>
  <text x="155" y="504" text-anchor="middle" class="lbl-sm" font-weight="700">M</text>
  <text x="155" y="545" text-anchor="middle" class="lbl" font-weight="600">Bomba</text>

  <!-- TANK -->
  <rect x="322" y="480" width="56" height="55" rx="2" fill="rgba(26,115,232,0.08)" stroke="#555" stroke-width="2"/>
  <path d="M324 510 Q332 505 340 510 T356 510 L376 510" fill="none" stroke="#1a73e8" stroke-width="1.5" opacity="0.6"/>
  <rect x="324" y="510" width="52" height="23" rx="1" fill="rgba(26,115,232,0.15)"/>
  <line x1="318" y1="480" x2="382" y2="480" stroke="#555" stroke-width="3"/>
  <text x="350" y="552" text-anchor="middle" class="lbl" font-weight="600">Tanque</text>

  <!-- SUCTION LINE -->
  <polyline points="155,526 155,575 350,575 350,535" class="pipe" stroke-dasharray="6,3"/>
  <text x="250" y="590" text-anchor="middle" class="lbl-sm">Succión</text>

  <!-- LEGEND -->
  <rect x="15" y="615" width="470" height="35" rx="6" fill="#f5f5f5" stroke="#ddd" stroke-width="1"/>
  <line x1="40" y1="632" x2="75" y2="632" stroke="#aaa" stroke-width="2.5" stroke-dasharray="8,4"/>
  <text x="82" y="637" class="lbl-sm">Sin flujo — puertos bloqueados</text>
  <rect x="275" y="624" width="14" height="14" rx="2" fill="rgba(220,53,69,0.15)" stroke="#dc3545" stroke-width="1.5"/>
  <text x="296" y="637" class="lbl-sm">Posición activa (centro cerrado)</text>
</svg>